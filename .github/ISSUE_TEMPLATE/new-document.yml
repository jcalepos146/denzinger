name: Propose a document
description: Propose a missing source, a complete text, or an improvement to an existing selection.
title: "New document: "
labels: [new document]
body:
  - type: input
    id: title
    attributes:
      label: Title or opening words
      placeholder: Ad ea ex debito pastoralis
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author and date
      placeholder: Eugene IV, 5 February 1447
    validations:
      required: true
  - type: textarea
    id: latin
    attributes:
      label: Latin (or original) text
      description: The passage you want quoted. Mark omissions with an ellipsis.
  - type: textarea
    id: english
    attributes:
      label: English translation
      description: Say whose translation it is, or that it is your own.
  - type: textarea
    id: citations
    attributes:
      label: Where it is printed
      description: Edition, volume, page or column, and a link to a scan if there is one (Mansi, Hardt, Mercati, a register…).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it belongs here
      description: What it shows, and how much weight it carries.
  - type: textarea
    id: research
    attributes:
      label: Research question or search that led here
      description: Optional. Describe the gap you want this source to address.
  - type: dropdown
    id: coverage
    attributes:
      label: Requested coverage
      options:
        - Source record and full-text link
        - Selected passages
        - Complete local text
  - type: textarea
    id: provenance
    attributes:
      label: Translation, reuse basis and verification
      description: Identify the translation and edition, whether reuse is permitted, and what has been compared with a primary source. Leave uncertain matters explicitly unresolved.
